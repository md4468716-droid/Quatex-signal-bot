<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FX Signal</title>
<style>
:root{--bg:#0b1220;--card:#131c2f;--line:#223049;--tx:#e8eefc;--mu:#8ea0c0;--up:#22c55e;--dn:#ef4444;--ac:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
h1{font-size:20px;margin:0}
button,select,input{font:inherit}
.icon{background:none;border:1px solid var(--line);color:var(--mu);border-radius:10px;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
select,input{width:100%;background:#0e1626;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
.go{width:100%;margin-top:12px;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700}
.go:disabled{opacity:.5}
.sig{text-align:center;padding:22px 8px;border-radius:14px;margin-top:4px}
.sig .big{font-size:38px;font-weight:800;letter-spacing:1px}
.sig .sub{font-size:14px;margin-top:6px;opacity:.9}
.call{background:rgba(34,197,94,.15);color:var(--up);border:1px solid var(--up)}
.put{background:rgba(239,68,68,.15);color:var(--dn);border:1px solid var(--dn)}
.none{background:#0e1626;color:var(--mu);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.mu{color:var(--mu)}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--mu)}
.warn{font-size:12.5px;color:#f5c26b;line-height:1.5;margin-top:14px}
.hidden{display:none}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.side{font-weight:800;font-size:18px;padding:6px 12px;border-radius:10px}
.side.call{color:var(--up);background:rgba(34,197,94,.15)}
.side.put{color:var(--dn);background:rgba(239,68,68,.15)}
.err{color:var(--dn);font-size:14px;margin-top:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header><h1>FX Signal</h1><button class="icon" id="gear">Setting</button></header>

<div class="card hidden" id="settings">
  <label>Twelve Data API Key (free: twelvedata.com)</label>
  <input id="key" type="password" placeholder="API key paste koro" autocomplete="off">
  <div style="height:12px"></div>
  <label>Quotex payout (jemon 85)</label>
  <input id="payout" type="number" min="50" max="100" value="85" inputmode="numeric">
  <button class="go" id="save" style="background:#1f2a44">Save</button>
</div>

<div class="card">
  <label>Currency pair</label>
  <select id="pair"></select>
  <button class="go" id="go">Signal dao</button>
  <button class="go" id="scan" style="background:#1f2a44">Scan all pairs (28)</button>
  <div class="err" id="err"></div>
</div>

<div class="card hidden" id="scanBox">
  <div id="scanList"></div>
</div>

<div class="card hidden" id="out">
  <div class="sig none" id="sig"><div class="big" id="sigTxt">-</div><div class="sub" id="sigSub"></div></div>
  <div style="margin-top:10px" id="rows"></div>
</div>

<div class="warn">
  Eta shudhu technical analysis-er signal, profit-er guarantee na. Prothome Quotex DEMO account-e test koro.
  Break-even win rate: <b id="be">54%</b>. Signal paoar shathe shathe entry dao, 5 minute expiry.
</div>
</div>

<script>
const CCY=["EUR","GBP","AUD","NZD","USD","CAD","CHF","JPY"];
const PAIRS=[];for(let i=0;i<CCY.length;i++)for(let j=i+1;j<CCY.length;j++)PAIRS.push(CCY[i]+"/"+CCY[j]);
const $=id=>document.getElementById(id);
const LS={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- UI setup ----------
PAIRS.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;$("pair").appendChild(o)});
$("pair").value=LS.get("pair","EUR/USD");
$("key").value=LS.get("tdkey","");
$("payout").value=LS.get("payout","85");
function updBE(){const p=parseFloat($("payout").value||85)/100;$("be").textContent=(100/(1+p)).toFixed(1)+"%"}
updBE();
if(!LS.get("tdkey","")) $("settings").classList.remove("hidden");
$("gear").onclick=()=>$("settings").classList.toggle("hidden");
$("save").onclick=()=>{LS.set("tdkey",$("key").value.trim());LS.set("payout",$("payout").value);updBE();$("settings").classList.add("hidden")};
$("pair").onchange=()=>LS.set("pair",$("pair").value);

// ---------- Indicators ----------
function ema(a,n){const k=2/(n+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o}
function rsi(c,n=14){const o=new Array(c.length).fill(NaN);
  for(let i=n;i<c.length;i++){let g=0,l=0;for(let j=i-n+1;j<=i;j++){const d=c[j]-c[j-1];if(d>0)g+=d;else l-=d}
    o[i]=l===0?100:100-100/(1+g/l)}return o}
function bands(c,n=20,k=2){const m=[],s=[];
  for(let i=0;i<c.length;i++){if(i<n-1){m.push(NaN);s.push(NaN);continue}
    let sum=0;for(let j=i-n+1;j<=i;j++)sum+=c[j];const mu=sum/n;let v=0;for(let j=i-n+1;j<=i;j++)v+=(c[j]-mu)**2;
    m.push(mu);s.push(Math.sqrt(v/(n-1)))}return {m,s,k}}

function strategies(c){
  const r=rsi(c),b=bands(c),e9=ema(c,9),e21=ema(c,21);
  const S={ "RSI (30/70)":[], "Bollinger Band":[], "EMA 9/21 cross":[] };
  for(let i=0;i<c.length;i++){
    S["RSI (30/70)"].push(isNaN(r[i])?0:r[i]<30?1:r[i]>70?-1:0);
    S["Bollinger Band"].push(isNaN(b.m[i])?0:c[i]<b.m[i]-b.k*b.s[i]?1:c[i]>b.m[i]+b.k*b.s[i]?-1:0);
    const d=e9[i]-e21[i],pd=i?e9[i-1]-e21[i-1]:0;
    S["EMA 9/21 cross"].push(i&&d>0&&pd<=0?1:i&&d<0&&pd>=0?-1:0);
  }
  return S;
}
function backtest(sig,c){let n=0,w=0;for(let i=50;i<c.length-1;i++){if(!sig[i])continue;const f=c[i+1]-c[i];if(f===0)continue;n++;if(sig[i]*f>0)w++}return {n,w}}

// ---------- Fetch ----------
async function load(pair,key){
  const url=`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(pair)}&interval=5min&outputsize=300&timezone=UTC&order=ASC&apikey=${encodeURIComponent(key)}`;
  const r=await fetch(url);const j=await r.json();
  if(j.status==="error"||!j.values)throw new Error(j.message||"Data ashe ni");
  let v=j.values.map(x=>({t:Date.parse(x.datetime.replace(" ","T")+"Z"),c:parseFloat(x.close)}));
  const now=Date.now();
  if(v.length&&v[v.length-1].t+300000>now)v.pop();   // adhura candle bad
  return v;
}

// ---------- Analysis ----------
async function analyze(pair,key){
  const v=await load(pair,key),c=v.map(x=>x.c);
  if(c.length<60)throw new Error("Poryapto data nei");
  const L=c.length-1,sinceClose=(Date.now()-v[L].t)/60000-5;
  const S=strategies(c),names=Object.keys(S);
  const e21=ema(c,21),e50=ema(c,50);
  const trend=e21[L]>e50[L]&&e50[L]>e50[L-5]?1:e21[L]<e50[L]&&e50[L]<e50[L-5]?-1:0;
  const trig=names.filter(n=>S[n][L]!==0);
  const sum=trig.reduce((a,n)=>a+S[n][L],0);
  return {pair,c,v,L,S,names,trend,trig,sum,sinceClose,closed:sinceClose>10};
}

function render(r){
  const {pair,c,v,L,S,names,trend,trig,sum}=r;
  const payout=parseFloat($("payout").value||85)/100,be=1/(1+payout);
  $("out").classList.remove("hidden");
  const box=$("sig");box.className="sig none";
  if(r.closed){
    $("sigTxt").textContent="BAZAR BONDHO";$("sigSub").textContent="Shesh candle "+Math.round(r.sinceClose)+" minute age-er. Mon-Fri e try koro.";
  }else if(!trig.length){
    $("sigTxt").textContent="NO SIGNAL";$("sigSub").textContent="Ekhon kono strategy trigger kore ni. Trade korar dorkar nei.";
  }else if(sum===0){
    $("sigTxt").textContent="CONFLICT";$("sigSub").textContent="Strategy-gulo ulte dik dekhachche. Skip koro.";
  }else{
    const up=sum>0;box.className="sig "+(up?"call":"put");
    $("sigTxt").textContent=up?"CALL (UP)":"PUT (DOWN)";
    $("sigSub").textContent=`${pair} | Expiry 5 min | ${trig.filter(n=>S[n][L]===(up?1:-1)).length}/${names.length} strategy ekmot`;
  }
  let rows="";
  rows+=`<div class="row"><span class="mu">Pair / Price</span><span>${pair} &nbsp; ${c[L].toFixed(c[L]>20?3:5)}</span></div>`;
  rows+=`<div class="row"><span class="mu">Candle close</span><span>${new Date(v[L].t+300000).toUTCString().slice(17,22)} UTC (${Math.max(0,Math.round(r.sinceClose))} min age)</span></div>`;
  rows+=`<div class="row"><span class="mu">Trend (EMA)</span><span>${trend>0?"UP":trend<0?"DOWN":"SIDEWAYS"}${trig.length&&sum!==0&&Math.sign(sum)*trend<0?' <span class="tag">trend-er biruddhe</span>':''}</span></div>`;
  names.forEach(n=>{
    const s=S[n][L],bt=backtest(S[n],c),wr=bt.n?bt.w/bt.n:0;
    rows+=`<div class="row"><span>${n}<br><span class="mu" style="font-size:12px">ager ${c.length} candle: ${bt.w}/${bt.n} jit${bt.n?` (${(wr*100).toFixed(0)}%)`:''}</span></span>
    <span style="color:${s>0?'var(--up)':s<0?'var(--dn)':'var(--mu)'}">${s>0?"CALL":s<0?"PUT":"-"}</span></div>`;
  });
  rows+=`<div class="row"><span class="mu">Break-even win rate</span><span>${(be*100).toFixed(1)}%</span></div>`;
  $("rows").innerHTML=rows;
}

// ---------- Single pair ----------
$("go").onclick=async()=>{
  const pair=$("pair").value,key=$("key").value.trim()||LS.get("tdkey","");
  $("err").textContent="";
  if(!key){$("settings").classList.remove("hidden");$("err").textContent="Age API key boshao (Setting).";return}
  $("go").disabled=true;$("go").textContent="Analysis cholche...";
  try{render(await analyze(pair,key))}catch(e){$("err").textContent="Error: "+e.message}
  $("go").disabled=false;$("go").textContent="Signal dao";
};

// ---------- Scan all pairs ----------
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let scanning=false,stopFlag=false;const results={};

function paintScan(done,errs,note){
  const all=Object.values(results);
  const sigs=all.filter(r=>!r.closed&&r.sum!==0)
    .sort((a,b)=>Math.abs(b.sum)-Math.abs(a.sum)||a.sinceClose-b.sinceClose);
  const none=all.filter(r=>!r.closed&&r.sum===0&&r.trig.length===0).length;
  const conf=all.filter(r=>!r.closed&&r.sum===0&&r.trig.length>0).length;
  let h=`<div class="mu" style="font-size:13px;margin-bottom:8px">${note||""}</div>`;
  h+=`<div class="mu" style="font-size:13px;margin-bottom:6px">Check hoyeche: ${done}/${PAIRS.length} | Signal: ${sigs.length} | No signal: ${none} | Conflict: ${conf} | Error: ${errs}</div>`;
  if(!sigs.length)h+=`<div class="mu" style="padding:10px 0">Ekhono kono pair-e signal nei.</div>`;
  sigs.forEach(r=>{
    const up=r.sum>0,votes=r.trig.filter(n=>r.S[n][r.L]===(up?1:-1)).length;
    const late=r.sinceClose>3;
    h+=`<div class="item" data-p="${r.pair}"><div><b>${r.pair}</b> <span class="tag">trend ${r.trend>0?"UP":r.trend<0?"DOWN":"SIDE"}</span>${late?' <span class="tag" style="color:#f5c26b">LATE</span>':''}<br>
      <span class="mu" style="font-size:12px">${votes}/${r.names.length} strategy | close ${new Date(r.v[r.L].t+300000).toUTCString().slice(17,22)} UTC, ${Math.max(0,Math.round(r.sinceClose))} min age</span></div>
      <div class="side ${up?'call':'put'}">${up?"CALL":"PUT"}</div></div>`;
  });
  $("scanList").innerHTML=h;
  document.querySelectorAll(".item").forEach(el=>el.onclick=()=>{
    const r=results[el.dataset.p];if(!r)return;
    $("pair").value=r.pair;LS.set("pair",r.pair);render(r);window.scrollTo({top:0,behavior:"smooth"});
  });
}

$("scan").onclick=async()=>{
  if(scanning){stopFlag=true;return}
  const key=$("key").value.trim()||LS.get("tdkey","");
  $("err").textContent="";
  if(!key){$("settings").classList.remove("hidden");$("err").textContent="Age API key boshao (Setting).";return}
  scanning=true;stopFlag=false;$("scan").textContent="Stop scan";
  $("scanBox").classList.remove("hidden");
  Object.keys(results).forEach(k=>delete results[k]);
  let done=0,errs=0,closed=false,fatal="";
  for(const p of PAIRS){
    if(stopFlag)break;
    paintScan(done,errs,`Scan cholche: ${p} ... (free key-te ~4 minute lagbe)`);
    let tries=0;
    while(true){
      try{const r=await analyze(p,key);results[p]=r;if(r.closed)closed=true;break}
      catch(e){
        const m=e.message||"";
        if(/api ?key|apikey|invalid|unauthor/i.test(m)){fatal="API key thik na: "+m;break}
        if(/credit|limit|minute/i.test(m)&&tries<2){tries++;paintScan(done,errs,"Limit chhunyeche, 1 minute opekkha...");await sleep(61000);continue}
        errs++;break;
      }
    }
    if(fatal)break;
    done++;
    if(closed)break;
    if(done<PAIRS.length&&!stopFlag)await sleep(7600);
  }
  const note=fatal?fatal:closed?"Bazar bondho (weekend ba chhutir din). Mon-Fri e try koro.":stopFlag?"Scan thamano hoyeche.":"Scan shesh. Signal-er pair-e tap koro. LATE hole candle purono, notun candle-er jonno abar scan koro.";
  paintScan(done,errs,note);
  scanning=false;$("scan").textContent="Scan all pairs (28)";
};

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
